# Confere todo push antes que ele vire deploy.
#
# Push em main dispara deploy de produção na Vercel — no aplicativo que a dona da loja
# usa todo dia. Até aqui, a única coisa que impedia código quebrado de chegar lá era
# alguém lembrar de rodar os comandos na mão.
#
# O que este robô pega: erro de tipo, erro de lint, e build que não compila.
# O que ele NÃO pega: bug de lógica e problema de layout. Para isso é preciso teste
# automatizado (ainda não existe) e conferência por imagem.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Push novo na mesma branch cancela a execução anterior, que já não interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Vite 7 exige Node 20.19+ ou 22.12+.
          node-version: '22'
          cache: npm

      # `npm ci` e não `npm install`: instala exatamente o que está no package-lock,
      # sem atualizar nada por conta própria. O CI tem que testar as mesmas versões
      # que rodam na sua máquina, não as mais novas do dia.
      - name: Instalar dependências
        run: npm ci

      # Catraca: o número só anda para trás. Começou em 45 (a dívida de `any` herdada),
      # está em 3 desde que ela foi paga. Os 3 que sobram são react-hooks/exhaustive-deps
      # no padrão "busca ao montar" — corrigi-los exige useCallback e muda QUANDO o efeito
      # dispara, com risco de laço infinito; não é troca mecânica e fica para quando
      # houver teste cobrindo essas telas.
      - name: Lint
        run: npm run lint -- --max-warnings 3

      # Cobre a lógica pura de src/lib: dinheiro, datas, classificação de cliente e
      # cache. Não cobre tela nem banco — para isso ainda é preciso olhar o app.
      - name: Testes
        run: npm test

      # `npm run build` já roda `tsc -b` antes do Vite, então cobre tipagem e compilação.
      - name: Build
        run: npm run build
